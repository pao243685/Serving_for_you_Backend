# Se copia a /opt/sfy/docker-compose.yml en la EC2 del backend.
name: sfy-back

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: serving
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en /opt/sfy/.env}
      APP_BACKEND_PASSWORD: ${APP_BACKEND_PASSWORD:?Define APP_BACKEND_PASSWORD en /opt/sfy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Estos scripts se ejecutan SOLO la primera vez (cuando el volumen está vacío), en orden:
      #   01_schema.sh  -> aplica db/squema-1.0.0.sql (el esquema que usa el código hoy)
      #   99_...sh      -> crea app_backend (sin ser dueño de las tablas) y fija su contraseña
      # El esquema v3 (db/01-04_*.sql) queda para cuando el backend use SET LOCAL ROLE.
      - ./db/squema-1.0.0.sql:/schema/squema-1.0.0.sql:ro
      - ./deploy/init-db/01_schema.sh:/docker-entrypoint-initdb.d/01_schema.sh:ro
      - ./deploy/init-db/99_set_backend_password.sh:/docker-entrypoint-initdb.d/99_set_backend_password.sh:ro
    healthcheck:
      # Por TCP (127.0.0.1): el servidor temporal de inicialización solo usa socket,
      # así "healthy" significa que los scripts de inicio ya terminaron.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d serving"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sin "ports": Postgres solo es accesible desde la red interna de Docker.

  backend:
    image: ${DOCKERHUB_USER:?Define DOCKERHUB_USER en /opt/sfy/.env}/sfy-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@db:5432/serving
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en /opt/sfy/.env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-5/minute}
      REDIS_URL: ""
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      ZONA_HORARIA_HORAS: ${ZONA_HORARIA_HORAS:--6}
      # Caddy publica la API bajo /api (y quita el prefijo): así /api/docs carga /api/openapi.json
      UVICORN_ROOT_PATH: /api
    ports:
      - "8000:8000"   # el security group solo permite el puerto 8000 desde la EC2 del front

volumes:
  pgdata:
